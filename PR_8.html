
<html>
<head>
  <title>Seminar Registration</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="style1.css">
</head>
<body>
<div class="form-container">
  <h2><i class="material-icons">assignment</i> Seminar Registration</h2>
  <label><i class="material-icons">person</i> First Name</label>
  <input type="text" placeholder="Enter your first name">
  <label><i class="material-icons">person</i> Middle Name</label>
  <input type="text" placeholder="Enter your middle name">
  <label><i class="material-icons">person</i> Last Name</label>
  <input type="text" placeholder="Enter your last name">
  <label><i class="material-icons">wc</i> Gender</label>
  <div class="gender-options">
    <label><input type="radio" name="gender" value="male"> Male</label>
    <label><input type="radio" name="gender" value="female"> Female</label>
    <label><input type="radio" name="gender" value="other"> Other</label>
  </div>
  <label><i class="material-icons">email</i> Email</label>
  <input type="email" placeholder="Enter your email">
  <label><i class="material-icons">phone</i> Phone Number</label>
  <input type="tel" placeholder="Enter your phone number">
  <label><i class="material-icons">location_on</i> Address</label>
  <input type="text" placeholder="Enter your address">
  <label><i class="material-icons">event_note</i> Seminar Topic</label>
  <select>
    <option disabled selected>-- Select Seminar --</option>
    <option>Web Development</option>
    <option>AI & Machine Learning</option>
    <option>Cyber Security</option>
    <option>Data Science</option>
  </select>
  <button><i class="material-icons">send</i> Register</button>
</div>
</body>
</html>
